name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Configure
        run: cmake --% -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Show formatting diff
        run: |
          files=$(find src tests -type f \( -name '*.cpp' -o -name '*.h' \))
          fail=0
          for f in $files; do
            if ! diff -u "$f" <(clang-format-18 --style=file "$f") > /dev/null; then
              echo "::group::$f"
              diff -u "$f" <(clang-format-18 --style=file "$f") || true
              echo "::endgroup::"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::warning::Some files are not clang-format clean. Run clang-format -i locally to fix."
          fi

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Configure (export compile commands)
        run: cmake --% -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build (generate moc/ui headers)
        run: cmake --build build --parallel

      - name: Run clang-tidy
        run: |
          files=$(find src -type f -name '*.cpp' ! -name 'main.cpp')
          clang-tidy-18 -p build --warnings-as-errors='' $files
